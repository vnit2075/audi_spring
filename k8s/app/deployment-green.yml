apiVersion: apps/v1
kind: Deployment
metadata:
  name: audi-showroom-green
  namespace: audi-showroom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audi-showroom
      color: green
  template:
    metadata:
      labels:
        app: audi-showroom
        color: green
    spec:
      containers:
        - name: audi-showroom
          image: audi/audi-showroom:latest   # replaced dynamically by app.sh deploy script
          ports:
            - containerPort: 8088
          env:
            - name: APP_NAME
              value: "audi-showroom-green"
            - name: DB_URL
              value: "jdbc:mysql://mysql.audi-showroom.svc.cluster.local:3306/audi_db?allowPublicKeyRetrieval=true&useSSL=false"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: "root"

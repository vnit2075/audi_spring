# -----------------------------
# Application Name
# -----------------------------
spring.application.name=${APP_NAME:audi-showroom}

# -----------------------------
# Database Configuration (ENV overrides allowed)
# -----------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/audi_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# -----------------------------
# JPA / Hibernate Settings
# -----------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# -----------------------------
# Server Settings
# -----------------------------
server.port=${SERVER_PORT:8088}
server.address=0.0.0.0
